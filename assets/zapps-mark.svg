<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="zapps-mark-title">
  <title id="zapps-mark-title">ZAPPS logo</title>
  <metadata>Copyright 2026 ZAPPS SOFTWARE LTD. All rights reserved. The ZAPPS folded Z mark, master artwork for dark backgrounds, first drawn 17 November 2026.</metadata>
  <defs>
    <linearGradient id="zm-top" gradientUnits="userSpaceOnUse" x1="94" y1="0" x2="382" y2="0">
      <stop offset="0" stop-color="#FF4FD2"/>
      <stop offset=".38" stop-color="#9A8CFF"/>
      <stop offset=".72" stop-color="#4FDCFF"/>
      <stop offset="1" stop-color="#E6FAFF"/>
    </linearGradient>
    <linearGradient id="zm-diag" gradientUnits="userSpaceOnUse" x1="382" y1="176" x2="94" y2="336">
      <stop offset="0" stop-color="#6FE6FF"/>
      <stop offset=".45" stop-color="#2479FF"/>
      <stop offset="1" stop-color="#0D2C9A"/>
    </linearGradient>
    <linearGradient id="zm-bot" gradientUnits="userSpaceOnUse" x1="94" y1="0" x2="418" y2="0">
      <stop offset="0" stop-color="#1440C8"/>
      <stop offset=".55" stop-color="#2FA8FF"/>
      <stop offset=".86" stop-color="#7FEAFF"/>
      <stop offset="1" stop-color="#F0FCFF"/>
    </linearGradient>
    <linearGradient id="zm-fold-top" gradientUnits="userSpaceOnUse" x1="382" y1="112" x2="300" y2="176">
      <stop offset="0" stop-color="#B4C0DE"/>
      <stop offset="1" stop-color="#2B3454"/>
    </linearGradient>
    <linearGradient id="zm-fold-bot" gradientUnits="userSpaceOnUse" x1="94" y1="336" x2="150" y2="400">
      <stop offset="0" stop-color="#46537A"/>
      <stop offset="1" stop-color="#121830"/>
    </linearGradient>
    <linearGradient id="zm-sheen-top" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="176">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".22" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="zm-sheen-bot" gradientUnits="userSpaceOnUse" x1="0" y1="336" x2="0" y2="400">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".22" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="zm-wave" gradientUnits="userSpaceOnUse" x1="104" y1="0" x2="330" y2="0">
      <stop offset="0" stop-color="#FFD9F5"/>
      <stop offset=".35" stop-color="#FF4FD2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="zm-top-clip">
      <path d="M94 112H382L282 176H94Z"/>
    </clipPath>
    <filter id="zm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="zm-wave-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Soft light behind the mark -->
  <g filter="url(#zm-glow)">
    <path d="M94 112H382V176L194 336H382L418 368L382 400H94V336L282 176H94Z" fill="#2E8BFF" opacity=".42"/>
    <path d="M94 112H230V176H94Z" fill="#FF4FD2" opacity=".45"/>
  </g>

  <!-- The folded ribbon: top bar, top fold, diagonal, bottom fold, bottom bar with its forward point -->
  <path d="M94 112H382L282 176H94Z" fill="url(#zm-top)"/>
  <path d="M382 112V176H282Z" fill="url(#zm-fold-top)"/>
  <path d="M282 176H382L194 336H94Z" fill="url(#zm-diag)"/>
  <path d="M94 336H194L94 400Z" fill="url(#zm-fold-bot)"/>
  <path d="M194 336H382L418 368L382 400H94Z" fill="url(#zm-bot)"/>

  <!-- Glass sheen on the bars -->
  <path d="M94 112H382L282 176H94Z" fill="url(#zm-sheen-top)"/>
  <path d="M194 336H382L418 368L382 400H94Z" fill="url(#zm-sheen-bot)"/>

  <!-- The voice wave inside the top bar -->
  <g clip-path="url(#zm-top-clip)" fill="none" stroke-linecap="round">
    <path d="M104 156C140 156 152 130 190 132S240 160 276 146S320 128 352 132" stroke="#FF4FD2" stroke-width="7" opacity=".6" filter="url(#zm-wave-glow)"/>
    <path d="M104 156C140 156 152 130 190 132S240 160 276 146S320 128 352 132" stroke="url(#zm-wave)" stroke-width="3"/>
  </g>

  <!-- Lit edges and fold creases -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M97 113.5H378" stroke-opacity=".75" stroke-width="2"/>
    <path d="M197 337.5H380L414 368" stroke-opacity=".7" stroke-width="2"/>
    <path d="M379 178L197 333" stroke-opacity=".35" stroke-width="2"/>
    <path d="M381 113L284 175" stroke-opacity=".5" stroke-width="1.5"/>
    <path d="M193 337L96 399" stroke-opacity=".3" stroke-width="1.5"/>
  </g>
</svg>
